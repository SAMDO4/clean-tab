<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>새 탭</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/glass.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="vt-bg" class="vt-bg" aria-hidden="true"></div>
  <div id="vt-dim" class="vt-dim" aria-hidden="true"></div>

  <nav id="vt-bookmarks" class="vt-bookmarks vt-glass" hidden></nav>

  <main id="vt-stage" class="vt-stage">
    <div id="vt-clock" class="vt-el vt-movable vt-glass vt-clock" data-key="clock" data-label="시계" hidden></div>
    <div id="vt-date" class="vt-el vt-movable vt-glass vt-date" data-key="date" data-label="날짜" hidden></div>
    <div id="vt-favorites" class="vt-el vt-movable vt-glass vt-favorites" data-key="favorites" data-label="즐겨찾기" hidden></div>
  </main>

  <div id="vt-editbar" class="vt-editbar" role="toolbar" aria-label="편집 모드" hidden>
    <span class="vt-editbar-text">편집 모드 · 요소를 끌어서 옮기세요</span>
    <button type="button" class="vt-editbar-btn" data-act="reset-layout">기본 배치 복원</button>
    <button type="button" class="vt-editbar-btn is-primary" data-act="done">완료</button>
  </div>

  <button id="vt-settings-btn" class="vt-settings-btn" type="button" aria-label="설정 열기" title="설정" aria-expanded="false">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
      <path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
        d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.6-2-3.4-2.4 1a7.5 7.5 0 0 0-2.6-1.5L14 2.5h-4l-.4 2.5a7.5 7.5 0 0 0-2.6 1.5l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 3l-2 1.6 2 3.4 2.4-1a7.5 7.5 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.5 7.5 0 0 0 2.6-1.5l2.4 1 2-3.4-2-1.6Z"/>
    </svg>
  </button>
</body>
</html>
